<!-- Standard HTML5 Document Type Declaration -->
<!doctype html>
<!-- HTML Root Element configured with English language attribute -->
<html lang="en">
  <!-- Document Metadata & Configuration Head Section -->
  <head>
    <!-- Unicode Character Encoding (supports all international text and symbols) -->
    <meta charset="UTF-8" />
    <!-- Responsive Viewport Configuration: disables artificial mobile zoom and sets width to device screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser Tab Title for the Application -->
    <title>TaskFlow</title>
  </head>
  <!-- Document Body: Visible content rendered by the browser -->
  <body>
    <!-- Root DOM Container: React attaches the entire virtual component tree inside this single div element -->
    <div id="root"></div>

    <!-- ES Module Script Tag: Entry point that loads main.jsx and launches Vite / React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
