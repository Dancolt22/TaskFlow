# Server Configuration
server.port=5000

# SQL Database Configuration (Year 1 Term 2 Diploma Curriculum Standard)
# Default: H2 Embedded SQL Database (zero-setup, works out of the box)
spring.datasource.url=jdbc:h2:mem:taskflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (available at http://localhost:5000/h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration for SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS & Application Properties
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===================================================================
# Alternative Production SQL Databases (PostgreSQL / MySQL)
# To use PostgreSQL or MySQL instead of H2, uncomment below and comment H2:
